name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package app
        run: |
          zip -r "CalWeave-${GITHUB_REF_NAME}.zip" index.html app.js calendar-core.js styles.css server.mjs package.json README.md LICENSE CHANGELOG.md VERSION assets tests .github
          sha256sum "CalWeave-${GITHUB_REF_NAME}.zip" > "CalWeave-${GITHUB_REF_NAME}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CalWeave-${{ github.ref_name }}.zip
            CalWeave-${{ github.ref_name }}.sha256
